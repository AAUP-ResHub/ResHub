{% extends 'base.html' %}

{% block content %}
<div class="container py-4">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{{ url_for('workspaces.index') }}">Workspaces</a></li>
            <li class="breadcrumb-item"><a href="{{ url_for('workspaces.workspace_detail', workspace_id=workspace.workspace_id) }}">{{ workspace.title }}</a></li>
            <li class="breadcrumb-item active" aria-current="page">Create Document</li>
        </ol>
    </nav>

    <h1 class="mb-4">Create New Document</h1>
    
    <div class="card shadow-sm">
        <div class="card-body">
            <form method="POST" action="{{ url_for('workspaces.create_document', workspace_id=workspace.workspace_id) }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                
                <div class="mb-3">
                    <label for="title" class="form-label">Document Title</label>
                    <input type="text" class="form-control" id="title" name="title" required>
                    <div class="form-text">Choose a descriptive title for your document.</div>
                </div>
                
                <div class="mb-3">
                    <label for="content" class="form-label">Initial Content</label>
                    <textarea class="form-control" id="content" name="content" rows="10"></textarea>
                    <div class="form-text">You can add content now or edit it later.</div>
                </div>
                
                <div class="d-flex justify-content-end">
                    <a href="{{ url_for('workspaces.workspace_detail', workspace_id=workspace.workspace_id) }}" class="btn btn-outline-secondary me-2">Cancel</a>
                    <button type="submit" class="btn btn-primary">Create Document</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
