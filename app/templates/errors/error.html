{% extends 'base.html' %}

{% block title %}{{ code }} - {{ message }} | ResHub{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <div class="card shadow">
                <div class="card-body py-5">
                    <h1 class="display-1 text-muted">{{ code }}</h1>
                    <h2 class="mb-4">{{ message }}</h2>
                    <p class="lead text-muted mb-4">{{ description }}</p>
                    <a href="{{ url_for('main.index') }}" class="btn btn-primary">Return to Home</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
