{% extends 'base.html' %}

{% block title %}Notifications | ResHub{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row">
        <div class="col-lg-8 offset-lg-2">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="mb-0">
                    <i class="bi bi-bell me-3"></i>
                    Notifications
                </h1>
                <button id="markAllRead" class="btn btn-outline-primary btn-sm">
                    <i class="bi bi-check-all me-1"></i>
                    Mark All Read
                </button>
            </div>

            <!-- Notification Filters -->
            <div class="mb-4">
                <div class="btn-group" role="group" aria-label="Notification filters">
                    <input type="radio" class="btn-check" name="filter" id="filter-all" autocomplete="off" checked>
                    <label class="btn btn-outline-secondary" for="filter-all">All</label>

                    <input type="radio" class="btn-check" name="filter" id="filter-unread" autocomplete="off">
                    <label class="btn btn-outline-secondary" for="filter-unread">Unread</label>

                    <input type="radio" class="btn-check" name="filter" id="filter-read" autocomplete="off">
                    <label class="btn btn-outline-secondary" for="filter-read">Read</label>
                </div>
            </div>

            <!-- Notifications List -->
            <div class="card">
                <div class="card-body p-0">
                    <div id="notifications-list">
                        <!-- Notifications will be loaded here via JavaScript -->
                        <div class="text-center p-5">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading notifications...</span>
                            </div>
                            <p class="mt-3 text-muted">Loading notifications...</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="text-center p-5" style="display: none;">
                <i class="bi bi-bell text-muted" style="font-size: 4rem;"></i>
                <h4 class="mt-3 text-muted">No notifications</h4>
                <p class="text-muted">You're all caught up! New notifications will appear here.</p>
            </div>
        </div>
    </div>
</div>

<!-- Notification Template -->
<template id="notification-template">
    <div class="notification-item border-bottom p-3" data-notification-id="">
        <div class="d-flex">
            <div class="flex-shrink-0 me-3">
                <div class="notification-icon rounded-circle d-flex align-items-center justify-content-center" 
                     style="width: 40px; height: 40px; background-color: #e9ecef;">
                    <i class="bi bi-bell-fill text-primary"></i>
                </div>
            </div>
            <div class="flex-grow-1">
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <h6 class="notification-title mb-1"></h6>
                        <p class="notification-message text-muted mb-1"></p>
                        <small class="notification-time text-muted"></small>
                    </div>
                    <div class="dropdown">
                        <button class="btn btn-sm btn-ghost" type="button" data-bs-toggle="dropdown">
                            <i class="bi bi-three-dots-vertical"></i>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item mark-read-btn" href="#"><i class="bi bi-check me-2"></i>Mark as Read</a></li>
                            <li><a class="dropdown-item delete-btn" href="#"><i class="bi bi-trash me-2"></i>Delete</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</template>

<script>
// Notifications page functionality
document.addEventListener('DOMContentLoaded', function() {
    let currentFilter = 'all';
    
    // CSRF token support
    function getCsrfToken() {
        const metaTag = document.querySelector('meta[name="csrf-token"]');
        if (metaTag) return metaTag.getAttribute('content');
        const cookies = document.cookie.split(';');
        for (let cookie of cookies) {
            const [name, value] = cookie.trim().split('=');
            if (name === 'csrf_token') return value;
        }
        return null;
    }
    
    function getHeaders() {
        const headers = { 'Content-Type': 'application/json' };
        const token = getCsrfToken();
        if (token) headers['X-CSRFToken'] = token;
        return headers;
    }
    
    // Load notifications
    function loadNotifications() {
        const listContainer = document.getElementById('notifications-list');
        const emptyState = document.getElementById('empty-state');
        
        fetch('/api/notifications?filter=' + currentFilter, {
            headers: getHeaders()
        })
            .then(response => response.json())
            .then(data => {
                if (data.notifications !== undefined) {
                    if (data.notifications.length === 0) {
                        listContainer.style.display = 'none';
                        emptyState.style.display = 'block';
                    } else {
                        listContainer.style.display = 'block';
                        emptyState.style.display = 'none';
                        renderNotifications(data.notifications);
                    }
                } else {
                    showError('Failed to load notifications');
                }
            })
            .catch(error => {
                console.error('Error loading notifications:', error);
                showError('Failed to load notifications');
            });
    }
    
    // Render notifications
    function renderNotifications(notifications) {
        const listContainer = document.getElementById('notifications-list');
        const template = document.getElementById('notification-template');
        
        listContainer.innerHTML = '';
        
        notifications.forEach(notification => {
            const clone = template.content.cloneNode(true);
            const item = clone.querySelector('.notification-item');
            
            item.dataset.notificationId = notification.id;
            item.classList.toggle('unread', !notification.is_read);
            
            clone.querySelector('.notification-title').textContent = notification.title || 'Notification';
            clone.querySelector('.notification-message').textContent = notification.message;
            clone.querySelector('.notification-time').textContent = formatTime(notification.created_at);
            
            // Icon based on type
            const icon = clone.querySelector('.notification-icon i');
            switch(notification.type) {
                case 'message':
                    icon.className = 'bi bi-chat-left-text-fill text-primary';
                    break;
                case 'paper':
                    icon.className = 'bi bi-file-earmark-text-fill text-success';
                    break;
                case 'workspace':
                    icon.className = 'bi bi-people-fill text-info';
                    break;
                default:
                    icon.className = 'bi bi-bell-fill text-primary';
            }
            
            // Event listeners
            clone.querySelector('.mark-read-btn').addEventListener('click', function(e) {
                e.preventDefault();
                markAsRead(notification.id);
            });
            
            clone.querySelector('.delete-btn').addEventListener('click', function(e) {
                e.preventDefault();
                deleteNotification(notification.id);
            });
            
            listContainer.appendChild(clone);
        });
    }
    
    // Filter notifications
    document.querySelectorAll('input[name="filter"]').forEach(radio => {
        radio.addEventListener('change', function() {
            currentFilter = this.id.replace('filter-', '');
            loadNotifications();
        });
    });
    
    // Mark all as read
    document.getElementById('markAllRead').addEventListener('click', function() {
        fetch('/api/notifications/mark-all-read', { 
            method: 'POST',
            headers: getHeaders()
        })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    loadNotifications();
                    showSuccess('All notifications marked as read');
                } else {
                    showError('Failed to mark notifications as read');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showError('Failed to mark notifications as read');
            });
    });
    
    // Helper functions
    function markAsRead(notificationId) {
        fetch(`/api/notifications/${notificationId}/read`, { 
            method: 'POST',
            headers: getHeaders()
        })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    loadNotifications();
                } else {
                    showError('Failed to mark as read');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showError('Failed to mark as read');
            });
    }
    
    function deleteNotification(notificationId) {
        if (confirm('Are you sure you want to delete this notification?')) {
            fetch(`/api/notifications/delete/${notificationId}`, { 
                method: 'DELETE',
                headers: getHeaders()
            })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        loadNotifications();
                        showSuccess('Notification deleted');
                    } else {
                        showError('Failed to delete notification');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    showError('Failed to delete notification');
                });
        }
    }
    
    function formatTime(timestamp) {
        const date = new Date(timestamp);
        const now = new Date();
        const diff = now - date;
        
        if (diff < 60000) return 'Just now';
        if (diff < 3600000) return Math.floor(diff / 60000) + ' minutes ago';
        if (diff < 86400000) return Math.floor(diff / 3600000) + ' hours ago';
        return date.toLocaleDateString();
    }
    
    function showSuccess(message) {
        // Create a toast notification for success
        const toast = document.createElement('div');
        toast.className = 'toast show position-fixed top-0 end-0 m-3';
        toast.innerHTML = `
            <div class="toast-body bg-success text-white">
                <i class="bi bi-check-circle me-2"></i>${message}
            </div>
        `;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }
    
    function showError(message) {
        // Create a toast notification for errors
        const toast = document.createElement('div');
        toast.className = 'toast show position-fixed top-0 end-0 m-3';
        toast.innerHTML = `
            <div class="toast-body bg-danger text-white">
                <i class="bi bi-exclamation-triangle me-2"></i>${message}
            </div>
        `;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 5000);
    }
    
    // Initial load
    loadNotifications();
});
</script>

<style>
.notification-item.unread {
    background-color: #f8f9fa;
    border-left: 4px solid #007bff;
}

.notification-item:hover {
    background-color: #f8f9fa;
}

.btn-ghost {
    border: none;
    background: none;
    color: #6c757d;
}

.btn-ghost:hover {
    background-color: #f8f9fa;
    color: #495057;
}

.toast {
    z-index: 1080;
}
</style>
{% endblock %}
