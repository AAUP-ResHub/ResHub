{% extends "base.html" %}

{% block title %}Edit Citation Metadata{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Edit Citation Metadata</h4>
                </div>
                <div class="card-body">
                    <div class="mb-4">
                        <h5>{{ paper.title }}</h5>
                        <p class="text-muted">These fields help generate accurate citations for your paper.</p>
                    </div>
                    
                    <form method="POST" action="{{ url_for('citation.edit_citation_metadata', paper_id=paper.paper_id) }}">
                        <div class="mb-3">
                            <label for="authors" class="form-label">Authors</label>
                            <input type="text" class="form-control" id="authors" name="authors" 
                                   value="{{ paper.authors or '' }}" placeholder="e.g., John Smith, Jane Doe">
                            <div class="form-text">Separate authors with commas</div>
                        </div>
                        
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="publication_year" class="form-label">Publication Year</label>
                                <input type="text" class="form-control" id="publication_year" name="publication_year" 
                                       value="{{ paper.publication_year or '' }}" placeholder="e.g., 2025">
                            </div>
                            <div class="col-md-6">
                                <label for="publisher" class="form-label">Publisher</label>
                                <input type="text" class="form-control" id="publisher" name="publisher" 
                                       value="{{ paper.publisher or '' }}" placeholder="e.g., IEEE">
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="journal" class="form-label">Journal/Conference</label>
                            <input type="text" class="form-control" id="journal" name="journal" 
                                   value="{{ paper.journal or '' }}" placeholder="e.g., Journal of Computer Science">
                        </div>
                        
                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label for="volume" class="form-label">Volume</label>
                                <input type="text" class="form-control" id="volume" name="volume" 
                                       value="{{ paper.volume or '' }}" placeholder="e.g., 42">
                            </div>
                            <div class="col-md-4">
                                <label for="issue" class="form-label">Issue</label>
                                <input type="text" class="form-control" id="issue" name="issue" 
                                       value="{{ paper.issue or '' }}" placeholder="e.g., 3">
                            </div>
                            <div class="col-md-4">
                                <label for="pages" class="form-label">Pages</label>
                                <input type="text" class="form-control" id="pages" name="pages" 
                                       value="{{ paper.pages or '' }}" placeholder="e.g., 123-145">
                            </div>
                        </div>
                        
                        <div class="mb-4">
                            <label for="doi" class="form-label">DOI</label>
                            <input type="text" class="form-control" id="doi" name="doi" 
                                   value="{{ paper.doi or '' }}" placeholder="e.g., 10.1234/example">
                            <div class="form-text">Digital Object Identifier (if available)</div>
                        </div>
                        
                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('paper.paper_detail', paper_id=paper.paper_id) }}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">Save Changes</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
